<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Our time together✨</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;1,400&family=Montserrat:wght@300&display=swap" rel="stylesheet">
<body>
    <canvas id="nebo"></canvas>
  <main>
    <div class="eyebrow">Just for you</div> 
    <h1>Our time together ♥</h1>

    <div class="counter">
        <div class="box"><div class="num" id="d">0</div><div class="lbl">days</div></div>
        <div class="box"><div class="num" id="h">0</div><div class="lbl">hours</div></div>
        <div class="box"><div class="num" id="m">0</div><div class="lbl">minutes</div></div>
        <div class="box"><div class="num" id="s">0</div><div class="lbl">seconds</div></div>
    </div>

    <div class="since">from 12. november 2026</div>

    <p class="msg">When i first met you, i didn't think you'd become this important to me. We used to be strangers, now you're somebody who i can't go one day without talking to.</p>
    <p class="msgone">I ♡ you!</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
